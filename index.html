html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{text-align:center;padding:26px 16px 18px;background:var(--btn);color:var(--bt)}

header p{margin:8px 0 0;font-size:14px}header a{color:inherit}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav a{flex:none;padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
main{max-width:640px;margin:0 auto;padding:6px 14px 100px}
h2{font:400 26px Rye,Georgia,serif;color:var(--acc);margin:26px 0 4px}
.note{color:var(--mut);font-size:14px;margin:0 0 6px}
.it{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.it b{display:block}.it small{color:var(--mut);display:block}
.pr{font-weight:800;white-space:nowrap;color:var(--acc)}
.ph{width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-top:8px;display:block}
.pay{margin-top:28px;padding:14px;border-radius:14px;background:var(--btn);color:var(--bt);text-align:center}
.in{width:100%;padding:9px;margin:3px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.ed{padding:12px 0;border-bottom:1px solid var(--line)}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .in{width:120px}
.bt{background:var(--btn);color:var(--bt);border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.s{padding:7px 10px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;z-index:9}
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:20;padding:16px}
.bx{background:var(--card);border-radius:16px;padding:18px;max-width:340px;width:100%;text-align:center}
#qr{background:#fff;padding:12px;border-radius:8px;display:inline-block;margin:10px 0}#qr canvas{display:none}#qr img{display:block}
</style></head><body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),A=$('#app'),S=JSON.parse($('#data').textContent);
let ed=false,qr=false,own=false,art=null,msg='';
const e=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pr=p=>p===''?'Consultar':e(p)+'$';
function R(){
 let h='<header><h1>El Rancho del Porrón</h1><p>Comida &amp; Music · <a href="https://www.instagram.com/elranchodelporron" target="_blank" rel="noopener">@elranchodelporron</a></p></header><nav>'+S.c.map((c,i)=>`<a href="#c${i}">${e(c.n)}</a>`).join('')+'</nav><main>';
 S.c.forEach((c,ci)=>{
  h+=`<section id="c${ci}"><h2>${ed?`<input class="in" data-f="cn" data-c="${ci}" value="${e(c.n)}">`:e(c.n)}</h2>`+(c.t?`<p class="note">${e(c.t)}</p>`:'');
  c.i.forEach((x,ii)=>{const k=`data-c="${ci}" data-i="${ii}"`;
   h+=ed?`<div class="ed"><input class="in" data-f="n" ${k} value="${e(x.n)}" placeholder="Nombre"><input class="in" data-f="d" ${k} value="${e(x.d)}" placeholder="Descripción"><div class="row"><input class="in" data-f="p" ${k} inputmode="decimal" value="${e(x.p)}" placeholder="Precio $"><label class="bt s">Foto<input type="file" accept="image/*" hidden data-a="img" ${k}></label>${x.g?`<button class="bt s" data-a="rg" ${k}>Quitar foto</button>`:''}<button class="bt s" data-a="del" ${k}>Borrar</button></div>${x.g?`<img class="ph" src="${x.g}" alt="">`:''}</div>`
   :`<div class="it"><div><b>${e(x.n)}</b>${x.d?`<small>${e(x.d)}</small>`:''}${x.g?`<img class="ph" loading="lazy" src="${x.g}" alt="${e(x.n)}">`:''}</div><span class="pr">${pr(x.p)}</span></div>`});
  if(ed)h+=`<p><button class="bt s" data-a="add" data-c="${ci}">+ Plato</button></p>`;
  h+='</section>'});
 h+=`<div class="pay"><b>Pago móvil</b><br>${e(S.p)}</div></main>`;
 if(own)h+=`<div class="bar">${msg?`<span class="note">${e(msg)}</span>`:''}<button class="bt" data-a="ed">${ed?'Terminar':'Editar menú'}</button>${ed?'<button class="bt" data-a="sv">Descargar archivo</button>':''}<button class="bt" data-a="qr">Código QR</button></div>`;
 if(qr)h+=`<div class="md"><div class="bx"><h3>Código QR del menú</h3><input class="in" id="u" value="${e(location.origin+location.pathname)}"><div id="qr"></div><p class="note">Si el enlace de arriba no es el público de tu menú, pégalo aquí y el QR se actualiza.</p><button class="bt" data-a="qx">Cerrar</button></div></div>`;
 A.innerHTML=h;if(qr)mk($('#u').value)}
function mk(v){const q=$('#qr');q.innerHTML='';if(window.QRCode)new QRCode(q,{text:v,width:240,height:240})}
function ph(f,ci,ii){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/im.width),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.c[ci].i[ii].g=cv.toDataURL('image/jpeg',.72);R()};im.src=r.result};r.readAsDataURL(f)}
async function sv(){
  const c=document.documentElement.cloneNode(true);
 c.querySelector('#app').innerHTML='';
 c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html>'+c.outerHTML],{type:'text/html'}));a.download='index.html';a.click();msg='Listo: sube el archivo descargado a tu sitio para publicar los cambios';R()}
A.onclick=ev=>{const b=ev.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.a,c=b.dataset.c,i=b.dataset.i;
 if(a==='ed')ed=!ed;else if(a==='qr')qr=true;else if(a==='qx')qr=false;else if(a==='add')S.c[c].i.push({n:'Nuevo plato',d:'',p:''});else if(a==='del')S.c[c].i.splice(i,1);else if(a==='rg')S.c[c].i[i].g='';else if(a==='sv')return sv();
 R()};
A.onchange=ev=>{const t=ev.target;if(t.dataset.a==='img'&&t.files[0])ph(t.files[0],+t.dataset.c,+t.dataset.i)};
A.oninput=ev=>{const t=ev.target,f=t.dataset.f;if(f==='cn')S.c[t.dataset.c].n=t.value;else if(f)S.c[t.dataset.c].i[t.dataset.i][f]=t.value;else if(t.id==='u')mk(t.value)};
own=/[?&]editar/.test(location.search);R();
</script></body></html>
